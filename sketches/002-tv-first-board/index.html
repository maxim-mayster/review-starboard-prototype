<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Starboard — TV Mode</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --brand-bg: radial-gradient(circle at top, #18345b 0%, #081322 56%, #050b14 100%);
      --uploaded-bg: none;
      --bg-blur: 8px;
      --overlay-opacity: 0.35;
    }
    body {
      margin: 0;
      color: #f7fbff;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100vh;
      height: 100dvh;
      position: relative;
      overflow: hidden;
      background: #050b14;
    }
    body::before {
      content: "";
      position: fixed;
      inset: -30px;
      background-image: var(--uploaded-bg), var(--brand-bg);
      background-size: cover, cover;
      background-position: center, center;
      filter: blur(var(--bg-blur));
      transform: scale(1.06);
      z-index: 0;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(4, 11, 21, calc(var(--overlay-opacity) * 0.7)),
        rgba(4, 11, 21, var(--overlay-opacity))
      );
      z-index: 0;
    }
    .wrap {
      position: relative;
      z-index: 1;
      padding: clamp(14px, 1.8vw, 24px);
      height: 100vh;
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(10px, 1.2vw, 16px);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }
    .brand {
      color: #f7fbff;
      font-weight: 900;
      font-size: clamp(44px, 5vw, 82px);
      line-height: .95;
      letter-spacing: -0.05em;
    }
    .logo {
      max-width: min(40vw, 460px);
      max-height: 120px;
      object-fit: contain;
      display: none;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,.25));
    }
    .month {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      border-radius: 999px;
      padding: 18px 28px;
      font-weight: 900;
      font-size: clamp(24px, 2.4vw, 40px);
      backdrop-filter: blur(14px);
    }
    .hero {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 16px;
      min-height: 0;
    }
    .panel {
      border-radius: 28px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.06);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 28px 60px rgba(0,0,0,.28);
      backdrop-filter: blur(14px);
    }
    .podium {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: end;
      min-height: 0;
    }
    .podium-card {
      border-radius: 24px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.08);
      text-align: center;
    }
    .podium-card.first { min-height: min(300px, 42vh); border-color: rgba(255,198,71,.55); }
    .podium-card.second { min-height: min(250px, 36vh); }
    .podium-card.third { min-height: min(220px, 32vh); }
    .rank {
      width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,.13); font-size: 24px; font-weight: 900;
    }
    .name { font-size: clamp(22px, 2.2vw, 34px); font-weight: 900; letter-spacing: -0.03em; }
    .score { margin-top: 18px; font-size: clamp(34px, 3vw, 54px); font-weight: 900; color: #ffc64a; }
    .rightcol {
      padding: 18px;
      display: grid;
      gap: 16px;
      align-content: stretch;
      min-height: 0;
      overflow: hidden;
    }
    .rightcol > div {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100%;
    }
    .list {
      padding: 10px 0 0;
      display: grid;
      gap: 12px;
      align-content: stretch;
      min-height: 100%;
      opacity: 1;
      transform: translateY(0);
      transition: opacity .45s ease, transform .45s ease;
    }
    .list.is-changing {
      opacity: 0;
      transform: translateY(12px);
    }
    .list-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 18px;
      align-content: start;
      min-height: 100%;
      overflow: hidden;
    }
    .row {
      display: grid;
      grid-template-columns: 60px 1fr 100px;
      align-items: center;
      padding: 13px 8px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      background: rgba(255,255,255,.04);
      gap: 10px;
      font-size: 22px;
    }
    .badge {
      width: 44px; height: 44px; border-radius: 50%;
      display:flex; align-items:center; justify-content:center;
      background: rgba(255,255,255,.1); font-weight: 900;
    }
    .page-status {
      color: rgba(255,255,255,.72);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    @media (max-width: 1100px) {
      .wrap { padding: 14px; gap: 12px; }
      .topbar { gap: 10px; }
      .brand { font-size: clamp(30px, 5vw, 54px); }
      .logo { max-height: 92px; }
      .month { padding: 12px 18px; font-size: clamp(18px, 3vw, 30px); }
      .hero { grid-template-columns: .78fr 1fr; gap: 12px; }
      .podium { padding: 16px; gap: 10px; }
      .podium-card { padding: 14px; border-radius: 18px; }
      .podium-card.first { min-height: 210px; }
      .podium-card.second { min-height: 180px; }
      .podium-card.third { min-height: 160px; }
      .name { font-size: clamp(18px, 2.6vw, 28px); }
      .score { font-size: clamp(24px, 3.5vw, 38px); }
      .rightcol { padding: 14px; }
      .list-grid { grid-template-columns: 1fr; }
      .row { grid-template-columns: 50px 1fr 78px; font-size: 20px; padding: 8px 6px; border-radius: 14px; }
      .badge { width: 40px; height: 40px; }
    }
    @media (max-width: 820px) and (orientation: portrait) {
      .hero { grid-template-columns: 1fr; }
      .podium { min-height: 210px; }
      .row { grid-template-columns: 48px 1fr 74px; font-size: 18px; padding: 7px 6px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <img id="brandLogo" class="logo" alt="Brand logo" />
        <div class="brand" id="brandText">Mayster Heating & Air</div>
      </div>
      <div class="month" id="monthLabel">September 2026</div>
    </div>

    <div class="hero">
      <section class="panel podium" id="podium"></section>
      <aside class="panel rightcol">
        <div>
          <div class="page-status" id="pageStatus"></div>
          <div class="list" id="fullList"></div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const STORAGE_KEYS = {
      employees: 'review-starboard-employees',
      background: 'review-starboard-tv-bg',
      logo: 'review-starboard-tv-logo',
      blur: 'review-starboard-tv-blur',
      overlay: 'review-starboard-tv-overlay'
    };

    const API_URL = '/api/state';
    const fallbackEmployees = [
      { id: 'brandon-r', name: 'Brandon R.', stars: 7, reviewCount: 6 },
      { id: 'marcus-j', name: 'Marcus J.', stars: 5, reviewCount: 5 },
      { id: 'alyssa-m', name: 'Alyssa M.', stars: 4, reviewCount: 4 }
    ];

    let employees = JSON.parse(localStorage.getItem(STORAGE_KEYS.employees) || 'null') || structuredClone(fallbackEmployees);
    let settings = {
      background: localStorage.getItem(STORAGE_KEYS.background) || '',
      logo: localStorage.getItem(STORAGE_KEYS.logo) || '',
      blur: Number(localStorage.getItem(STORAGE_KEYS.blur) || 8),
      overlay: Number(localStorage.getItem(STORAGE_KEYS.overlay) || 35)
    };
    let currentPage = 0;

    function saveLocalCopy() {
      localStorage.setItem(STORAGE_KEYS.employees, JSON.stringify(employees));
      localStorage.setItem(STORAGE_KEYS.background, settings.background || '');
      localStorage.setItem(STORAGE_KEYS.logo, settings.logo || '');
      localStorage.setItem(STORAGE_KEYS.blur, String(settings.blur ?? 8));
      localStorage.setItem(STORAGE_KEYS.overlay, String(settings.overlay ?? 35));
    }

    function normalizeState(nextState = {}) {
      employees = (Array.isArray(nextState.employees) ? nextState.employees : fallbackEmployees).map(employee => ({
        ...employee,
        stars: Number.isFinite(Number(employee.stars)) ? Number(employee.stars) : 0,
        reviewCount: Number.isFinite(Number(employee.reviewCount)) ? Number(employee.reviewCount) : Number(employee.stars || 0)
      }));
      settings = {
        background: nextState.settings?.background || '',
        logo: nextState.settings?.logo || '',
        blur: Number(nextState.settings?.blur ?? 8),
        overlay: Number(nextState.settings?.overlay ?? 35)
      };
      saveLocalCopy();
    }

    async function loadCloudState() {
      try {
        const response = await fetch(`${API_URL}?t=${Date.now()}`, { cache: 'no-store' });
        const payload = await response.json();
        if (!response.ok || !payload.ok) throw new Error(payload.error || 'Could not load shared board.');
        normalizeState(payload.state);
        render();
      } catch (error) {
        try {
          // Emergency static-host fallback for GitHub Pages when Vercel is blocked.
          const fallbackResponse = await fetch(`../../data/starboard-state.json?t=${Date.now()}`, { cache: 'no-store' });
          if (!fallbackResponse.ok) throw new Error('Static state unavailable.');
          const fallbackState = await fallbackResponse.json();
          normalizeState(fallbackState.state || fallbackState);
          render();
          document.getElementById('pageStatus').textContent = document.getElementById('pageStatus').textContent.replace('SHOWING', 'BACKUP SHOWING');
        } catch (fallbackError) {
          document.getElementById('pageStatus').textContent = 'Offline copy';
        }
      }
    }

    function applyBranding() {
      const savedBg = settings.background;
      const savedLogo = settings.logo;
      const savedBlur = Number(settings.blur ?? 8);
      const savedOverlay = Number(settings.overlay ?? 35) / 100;
      if (savedBg) {
        document.documentElement.style.setProperty('--uploaded-bg', `url(${savedBg})`);
      } else {
        document.documentElement.style.setProperty('--uploaded-bg', 'none');
      }
      document.documentElement.style.setProperty('--bg-blur', `${savedBlur}px`);
      document.documentElement.style.setProperty('--overlay-opacity', String(savedOverlay));

      const logo = document.getElementById('brandLogo');
      const text = document.getElementById('brandText');
      if (savedLogo) {
        logo.src = savedLogo;
        logo.style.display = 'block';
        text.style.display = 'none';
      } else {
        logo.removeAttribute('src');
        logo.style.display = 'none';
        text.style.display = 'block';
      }
    }

    function list() {
      return [...employees].sort((a,b) => b.stars - a.stars || a.name.localeCompare(b.name));
    }

    function chunk(list, size) {
      const pages = [];
      for (let i = 0; i < list.length; i += size) pages.push(list.slice(i, i + size));
      return pages;
    }

    function pageSizeFor(count) {
      // Keep enough names on each rotation page so tablet/mobile screens do not
      // leave a big empty gap at the bottom of the list panel.
      if (window.innerWidth <= 1100) return 8;
      if (window.innerWidth <= 1366) return 12;
      if (count <= 12) return 12;
      if (count <= 20) return 14;
      return 14;
    }

    function advancePage() {
      const sorted = list();
      const pageSize = pageSizeFor(sorted.length);
      const pageCount = chunk(sorted, pageSize).length;
      if (pageCount <= 1) return;
      const fullList = document.getElementById('fullList');
      fullList.classList.add('is-changing');
      setTimeout(() => {
        currentPage = (currentPage + 1) % pageCount;
        render();
        requestAnimationFrame(() => fullList.classList.remove('is-changing'));
      }, 450);
    }

    function render() {
      applyBranding();
      const sorted = list();
      const podium = sorted.slice(0, 3);
      document.getElementById('podium').innerHTML = podium.map((p, i) => `
        <div class="podium-card ${['first','second','third'][i] || ''}">
          <div class="rank">${i + 1}</div>
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="score">${p.stars} ★</div>
        </div>
      `).join('') || '<div class="name">No employees yet</div>';

      const pageSize = pageSizeFor(sorted.length);
      const pages = chunk(sorted, pageSize);
      if (currentPage >= pages.length) currentPage = 0;
      const page = pages[currentPage] || [];
      document.getElementById('fullList').innerHTML = page.length
        ? `<div class="list-grid">${page.map((employee, index) => `
            <div class="row">
              <div class="badge">${(currentPage * pageSize) + index + 1}</div>
              <div><strong>${escapeHtml(employee.name)}</strong></div>
              <div style="font-weight:900; color:#ffc64a;">${employee.stars} ★</div>
            </div>
          `).join('')}</div>`
        : '<div class="name">No employees yet</div>';

      document.getElementById('pageStatus').textContent = pages.length > 1
        ? `Showing ${currentPage + 1} of ${pages.length}`
        : `${sorted.length} employees`;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;');
    }

    window.addEventListener('resize', render);
    window.addEventListener('storage', render);
    render();
    loadCloudState();
    setInterval(loadCloudState, 30000);
    setInterval(advancePage, 10000);
  </script>
</body>
</html>
